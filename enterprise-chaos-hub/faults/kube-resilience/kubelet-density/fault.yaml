---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Check kube resilience upon pod creation stress
kind: ChaosExperiment
metadata:
  name: kubelet-density
  labels:
    name: kubelet-density
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Cluster
    permissions:
      # Create and monitor the experiment & helper pods
      - apiGroups: [""]
        resources: ["pods"]
        verbs:
          [
            "create",
            "delete",
            "get",
            "list",
            "patch",
            "update",
            "deletecollection",
          ]
      # Track and get the runner, experiment, and helper pods log
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get", "list", "watch"]
      # To perform CRUD operations on the events inside chaosengine and chaosresult
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      # To create namespaces for the pod storm (delete/recreate upon re-runs)
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["create", "delete", "get", "list"]
      # To fetch kube stress workload configmaps specified by users
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # for creation and monitor of experiment job by the chaos-runner
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create", "list", "get", "delete", "deletecollection"]
      # for creation, status polling and deletion of litmus chaos resources used within a chaos workflow
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name kubelet-density
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: ""

    labels:
      name: kubelet-density
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
