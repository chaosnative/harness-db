---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: ecs-container-io-stress
  namespace: default
  labels:
    name: ecs-container-io-stress
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
    app.kubernetes.io/enableAWSAccessViaSecrets: disable
spec:
  engineState: "active"
  terminationGracePeriodSeconds: 30
  chaosServiceAccount: litmus-admin
  experiments:
    - name: ecs-container-io-stress
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name ecs-container-io-stress
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"

            - name: RAMP_TIME
              value: ""

            - name: CLUSTER_NAME
              value: ""

            - name: SERVICE_NAME
              value: ""

            - name: REGION
              value: ""

            # set file-system utilization bytes in GB
            - name: FILESYSTEM_UTILIZATION_BYTES
              value: "1"

            - name: FILESYSTEM_UTILIZATION_PERCENTAGE
              value: "0"

            - name: VOLUME_MOUNT_PATH
              value: "/tmp"

            - name: NUMBER_OF_WORKERS
              value: "1"

            - name: INSTALL_DEPENDENCIES
              value: "True"

            - name: AWS_SHARED_CREDENTIALS_FILE
              value: "/tmp/cloud_config.yml"

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: SEQUENCE
              value: "parallel"
          projectedVolumes:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
              projected:
                defaultMode: 420
                sources:
                  - serviceAccountToken:
                      audience: sts.amazonaws.com
                      expirationSeconds: 86400
                      path: token
