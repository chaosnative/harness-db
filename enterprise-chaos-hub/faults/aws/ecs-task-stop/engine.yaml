---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: ecs-task-stop
  namespace: default
  labels:
    name: ecs-task-stop
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
    app.kubernetes.io/enableAWSAccessViaSecrets: disable
spec:
  engineState: "active"
  terminationGracePeriodSeconds: 30
  chaosServiceAccount: ecs-task-stop-sa
  experiments:
    - name: ecs-task-stop
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name ecs-task-stop
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"

            - name: RAMP_TIME
              value: ""

            - name: CHAOS_INTERVAL
              value: "10"

            - name: CLUSTER_NAME
              value: ""

            - name: SERVICE_NAME
              value: ""

            - name: REGION
              value: ""

            - name: TASK_REPLICA_ID
              value: ""

            - name: TASK_REPLICA_AFFECTED_PERC
              value: "100"

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: SEQUENCE
              value: "parallel"

            - name: AWS_SHARED_CREDENTIALS_FILE
              value: "/tmp/cloud_config.yml"
        probe:
          - name: healthcheck-pre-chaos
            type: cmdProbe
            mode: SOT
            runProperties:
              probeTimeout: 5s
              retry: 0
              interval: 1s
              stopOnFailure: false
            cmdProbe/inputs:
              command: ./healthcheck -name aws-ecs-task-stop-pre-chaos
              source:
                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                inheritInputs: true
                volumeMount:
                  - mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                    name: aws-iam-token
                    readOnly: true
                volumes:
                  - name: aws-iam-token
                    projected:
                      defaultMode: 420
                      sources:
                        - serviceAccountToken:
                            audience: sts.amazonaws.com
                            expirationSeconds: 86400
                            path: token
              comparator:
                type: string
                criteria: contains
                value: "[P000]"
          - name: healthcheck-post-chaos
            type: cmdProbe
            mode: EOT
            runProperties:
              probeTimeout: 5s
              retry: 0
              interval: 1s
              stopOnFailure: false
            cmdProbe/inputs:
              command: ./healthcheck -name aws-ecs-task-stop-post-chaos
              source:
                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                inheritInputs: true
              comparator:
                type: string
                criteria: contains
                value: "[P000]"
