---
apiVersion: litmuschaos.io/v1alpha1
kind: K8sFault
metadata:
  name: ecs-fargate-cpu-hog
spec:
  definition:
    chaos:
      experiment: ecs-fargate-cpu-hog
      serviceAccountName: litmus-admin
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-ddcr-faults:1.54.0
      imagePullPolicy: Always
      env:
        - name: TOTAL_CHAOS_DURATION
          value: "30"

        - name: CHAOS_INTERVAL
          value: "30"

        - name: CLUSTER_NAME
          value: ""

        - name: SERVICE_NAME
          value: ""

        - name: REGION
          value: ""

        - name: CPU_CORES
          value: "1"

        - name: CONTAINER_IMAGE
          value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0

        - name: SIDECAR_CONTAINER
          value: "default"

        - name: TASK_REPLICA_AFFECTED_PERC
          value: "100"

        - name: RAMP_TIME
          value: ""
