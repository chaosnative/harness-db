---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: aws-ssm-chaos-by-id
  namespace: default
  labels:
    name: aws-ssm-chaos-by-id
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
    app.kubernetes.io/enableAWSAccessViaSecrets: disable
spec:
  engineState: "active"
  terminationGracePeriodSeconds: 30
  chaosServiceAccount: litmus-admin
  experiments:
    - name: aws-ssm-chaos-by-id
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name aws-ssm-chaos-by-id
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"

            - name: CHAOS_INTERVAL
              value: "60"

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            # Instance ID of the target EC2 instance
            # Multiple IDs can also be provided as comma separated values ex: id1,id2
            - name: EC2_INSTANCE_ID
              value: ""

            - name: REGION
              value: ""

            # it defines the sequence of chaos execution for multiple target instances
            # supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"

            # Provide the path of AWS credentials mounted from secret
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: "/tmp/cloud_config.yml"

            # provide the number of workers for memory stress
            - name: NUMBER_OF_WORKERS
              value: "1"

            # provide the percentage of available memory to stress
            - name: MEMORY_PERCENTAGE
              value: "80"

            # provide the CPU chores to be consumed
            # 0 will consume all the available CPU cores
            - name: CPU_CORE
              value: "0"

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            # Provide the name of SSM doc
            # if not using the default stress docs
            - name: DOCUMENT_NAME
              value: "LitmusChaos-AWS-SSM-Doc"

            # Provide the type of SSM doc
            # if not using the default stress docs
            - name: DOCUMENT_TYPE
              value: "Command"

            # Provide the format of SSM doc
            # if not using the default stress docs
            - name: DOCUMENT_FORMAT
              value: "YAML"

            # Provide the path of SSM doc
            # if not using the default stress docs
            - name: DOCUMENT_PATH
              value: "Litmus-AWS-SSM-Docs-For-EC2-CPU-Hog.yml"

              # if you want to install dependencies to run default SSM docs
            - name: INSTALL_DEPENDENCIES
              value: "True"

        probe:
          - name: healthcheck
            type: cmdProbe
            mode: Edge
            runProperties:
              probeTimeout: 5s
              retry: 0
              interval: 1s
              stopOnFailure: false
            cmdProbe/inputs:
              command: ./healthcheck -name aws-ssm-by-id
              source:
                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                inheritInputs: true
                volumeMount:
                  - mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                    name: aws-iam-token
                    readOnly: true
                volumes:
                  - name: aws-iam-token
                    projected:
                      defaultMode: 420
                      sources:
                        - serviceAccountToken:
                            audience: sts.amazonaws.com
                            expirationSeconds: 86400
                            path: token
              comparator:
                type: string
                criteria: contains
                value: "[P000]"
