---
apiVersion: litmuchaos.io/v1alpha1
kind: K8sFault
metadata:
  name: fis-dynamodb-replication-pause
spec:
  definition:
    chaos:
      experiment: fis-dynamodb-replication-pause
      serviceAccountName: litmus-admin
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-ddcr-faults:1.54.0
      imagePullPolicy: Always
      env:
        - name: TOTAL_CHAOS_DURATION
          value: "30"

        - name: CHAOS_INTERVAL
          value: "30"

        - name: TABLE_NAMES
          value: ""

        - name: FIS_ROLE_ARN
          value: ""

        - name: FIS_ACCOUNT_ID
          value: ""

        - name: STOP_CONDITION_CLOUDWATCH_ALARMS
          value: ""

        - name: COUNT
          value: ""

        - name: REGION
          value: ""

        - name: RAMP_TIME
          value: ""
