---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    It injects ec2-dns-chaos chaos on EC2 instance for certain chaos duration
kind: ChaosExperiment
metadata:
  name: ec2-dns-chaos
  labels:
    name: ec2-dns-chaos
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups:
          - ""
        resources:
          - pods
        verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - deletecollection
      - apiGroups:
          - ""
        resources:
          - events
        verbs:
          - create
          - get
          - list
          - patch
          - update
      - apiGroups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - list
      - apiGroups:
          - ""
        resources:
          - pods/log
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - pods/exec
        verbs:
          - get
          - list
          - create
      - apiGroups:
          - apps
        resources:
          - deployments
          - statefulsets
          - replicasets
          - daemonsets
        verbs:
          - list
          - get
      - apiGroups:
          - apps.openshift.io
        resources:
          - deploymentconfigs
        verbs:
          - list
          - get
      - apiGroups:
          - ""
        resources:
          - replicationcontrollers
        verbs:
          - get
          - list
      - apiGroups:
          - argoproj.io
        resources:
          - rollouts
        verbs:
          - list
          - get
      - apiGroups:
          - batch
        resources:
          - jobs
        verbs:
          - create
          - list
          - get
          - delete
          - deletecollection
      - apiGroups:
          - litmuschaos.io
        resources:
          - chaosengines
          - chaosexperiments
          - chaosresults
        verbs:
          - create
          - list
          - get
          - patch
          - update
          - delete
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name ec2-dns-chaos
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "30"
      - name: RAMP_TIME
        value: ""
      - name: REGION
        value: ""
      - name: EC2_INSTANCE_ID
        value: ""
      - name: TARGET_HOSTNAMES
        value: ""
      - name: MATCH_SCHEME
        value: "substring"
      - name: PORT
        value: "54"
      - name: DEFAULT_HEALTH_CHECK
        value: "false"
      - name: AWS_SHARED_CREDENTIALS_FILE
        value: /tmp/cloud_config.yml
    labels:
      name: ec2-dns-chaos
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
      app.kubernetes.io/enableAWSAccessViaSecrets: disable
