---
apiVersion: litmuchaos.io/v1alpha1
kind: K8sFault
metadata:
  name: lambda-delete-function-concurrency
spec:
  definition:
    chaos:
      experiment: lambda-delete-function-concurrency
      serviceAccountName: litmus-admin
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-ddcr-faults:1.54.0
      imagePullPolicy: Always
      env:
        - name: TOTAL_CHAOS_DURATION
          value: "30"

        - name: CHAOS_INTERVAL
          value: "30"

        - name: FUNCTION_NAME
          value: ""

        - name: REGION
          value: ""

        - name: FUNCTION_VERSION
          value: "$LATEST"

        - name: SEQUENCE
          value: "parallel"

        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /tmp/cloud_config.yml

        - name: RAMP_TIME
          value: ""
