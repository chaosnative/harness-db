---
apiVersion: litmuschaos.io/v1alpha1

description:
  message: >
    It injects ec2-http-modify-header chaos on EC2 instance for certain chaos
    duration
kind: ChaosExperiment
metadata:
  name: ec2-http-modify-header
  labels:
    name: ec2-http-modify-header
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups:
          - ""
        resources:
          - pods
        verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - deletecollection
      - apiGroups:
          - ""
        resources:
          - events
        verbs:
          - create
          - get
          - list
          - patch
          - update
      - apiGroups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - list
      - apiGroups:
          - ""
        resources:
          - pods/log
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ""
        resources:
          - pods/exec
        verbs:
          - get
          - list
          - create
      - apiGroups:
          - apps
        resources:
          - deployments
          - statefulsets
          - replicasets
          - daemonsets
        verbs:
          - list
          - get
      - apiGroups:
          - apps.openshift.io
        resources:
          - deploymentconfigs
        verbs:
          - list
          - get
      - apiGroups:
          - ""
        resources:
          - replicationcontrollers
        verbs:
          - get
          - list
      - apiGroups:
          - argoproj.io
        resources:
          - rollouts
        verbs:
          - list
          - get
      - apiGroups:
          - batch
        resources:
          - jobs
        verbs:
          - create
          - list
          - get
          - delete
          - deletecollection
      - apiGroups:
          - litmuschaos.io
        resources:
          - chaosengines
          - chaosexperiments
          - chaosresults
        verbs:
          - create
          - list
          - get
          - patch
          - update
          - delete
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name ec2-http-modify-header
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "30"
      - name: RAMP_TIME
        value: ""
      - name: REGION
        value: ""
      - name: EC2_INSTANCE_ID
        value: ""
      - name: NETWORK_INTERFACE
        value: eth0
      - name: TARGET_SERVICE_PORT
        value: "80"
      - name: HEADERS_MAP
        value: '{"key": "value"}'
      - name: HEADERS_MODE
        value: "response"
      - name: SEQUENCE
        value: "parallel"
      - name: DEFAULT_HEALTH_CHECK
        value: "false"
      - name: AWS_SHARED_CREDENTIALS_FILE
        value: /tmp/cloud_config.yml
    labels:
      name: ec2-http-modify-header
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
      app.kubernetes.io/enableAWSAccessViaSecrets: disable
