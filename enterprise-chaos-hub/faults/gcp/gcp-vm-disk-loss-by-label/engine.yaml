---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: gcp-vm-disk-loss-by-label
  labels:
    name: gcp-vm-disk-loss-by-label
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
spec:
  engineState: "active"
  terminationGracePeriodSeconds: 30
  chaosServiceAccount: litmus-admin
  experiments:
    - name: gcp-vm-disk-loss-by-label
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name gcp-vm-disk-loss-by-label
      command:
        - /bin/bash
      spec:
        components:
          env:
            # set chaos duration (in sec) as desired
            - name: TOTAL_CHAOS_DURATION
              value: "30"

            # set chaos interval (in sec) as desired
            - name: CHAOS_INTERVAL
              value: "30"

            # set the GCP project id
            - name: GCP_PROJECT_ID
              value: ""

            # set the zone in which all the disks are created
            # all the disks must exist in the same zone
            - name: ZONES
              value: ""

            # set the label of the target disk volumes
            - name: DISK_VOLUME_LABEL
              value: ""

            # set the percentage value of the disks with the given label
            # which should be targeted as part of the chaos injection
            - name: DISK_AFFECTED_PERC
              value: ""

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: SEQUENCE
              value: "parallel"
          secrets:
            - name: cloud-secret
              mountPath: /tmp/
        probe:
          - name: healthcheck
            type: cmdProbe
            mode: SOT
            runProperties:
              probeTimeout: 5s
              retry: 0
              interval: 1s
              stopOnFailure: false
            cmdProbe/inputs:
              command: ./healthcheck -name gcp-vm-disk-loss-by-label
              source:
                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                inheritInputs: true
              comparator:
                type: string
                criteria: contains
                value: "[P000]"
