---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Kills the services on GCP instance to check the resiliency.
kind: ChaosExperiment
metadata:
  name: gcp-vm-service-kill
  labels:
    name: gcp-vm-service-kill
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Cluster
    permissions:
      # Create and monitor the experiment & helper pods
      - apiGroups: [""]
        resources: ["pods"]
        verbs:
          [
            "create",
            "delete",
            "get",
            "list",
            "patch",
            "update",
            "deletecollection",
          ]
      # Performs CRUD operations on the events inside chaosengine and chaosresult
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      # Fetch configmaps details and mount it to the experiment pod (if specified)
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # Track and get the runner, experiment, and helper pods log
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get", "list", "watch"]
      # for creating and managing to execute commands inside target container
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["get", "list", "create"]
      # for configuring and monitor the experiment job by the chaos-runner pod
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create", "list", "get", "delete", "deletecollection"]
      # for creation, status polling and deletion of litmus chaos resources used within a chaos workflow
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
      # for experiment to perform node status checks
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["get", "list"]
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name gcp-vm-service-kill
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "90" # in seconds

      # Period to wait before injection of chaos in sec
      - name: RAMP_TIME
        value: ""

      - name: NODE_LABEL
        value: ""

      # provide lib image
      - name: LIB_IMAGE
        value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0

      - name: SERVICE_NAME
        value: 'containerd'

      - name: MASK
        value: 'disable'

      - name: VM_USERNAME
        value: ''

      - name: GCP_PROJECT_ID
        value: ''

      - name: VM_INSTANCE_NAME
        value: ""

      - name: SUDO_ENABLED
        value: 'true'

      - name: SET_HELPER_DATA
        value: 'true'

    labels:
      name: gcp-vm-service-kill
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/service-kill: "true"
      app.kubernetes.io/version: ci
