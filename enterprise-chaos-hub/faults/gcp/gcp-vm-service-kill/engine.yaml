---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: gcp-vm-service-kill
  namespace: default
  labels:
    name: gcp-vm-service-kill
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/service-kill: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  auxiliaryAppInfo: ""
  chaosServiceAccount: litmus-admin
  experiments:
    - name: gcp-vm-service-kill
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name gcp-vm-service-kill
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "90" # in seconds

            # Period to wait before injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            - name: NODE_LABEL
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0

            - name: SERVICE_NAME
              value: 'containerd'

            - name: MASK
              value: 'disable'

            - name: VM_USERNAME
              value: ''

            - name: GCP_PROJECT_ID
              value: ''

            - name: VM_INSTANCE_NAME
              value: ""

            - name: SUDO_ENABLED
              value: 'true'

            - name: SET_HELPER_DATA
              value: 'true'
