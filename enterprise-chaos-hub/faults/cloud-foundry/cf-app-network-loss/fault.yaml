---
apiVersion: litmuchaos.io/v1alpha1
kind: LinuxFault
metadata:
  name: cf-app-network-loss
  labels:
    name: app-network-loss
spec:
  cfAppNetworkChaos/inputs:
    duration: 30s
    faultInjectorLocation: "local"
    deploymentModel: ""
    app: ""
    organization: ""
    space: ""
    networkInterface: "eth0"
    boshDeployment: ""
    destinationHosts: ""
    destinationIPs: ""
    sourcePorts: ""
    destinationPorts: ""
    packetLossPercentage: 100
    instanceAffectedPercentage: 0
    faultInjectorPort: 50320
    skipSSLValidation: false
    rampTime: ""
