---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: vmware-network-rate-limit
  namespace: default
  labels:
    name: vmware-network-rate-limit
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
spec:
  engineState: "active"
  terminationGracePeriodSeconds: 30
  chaosServiceAccount: litmus-admin
  experiments:
    - name: vmware-network-rate-limit
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name vmware-network-rate-limit
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: VM_NAME
              value: ""

            - name: VM_USER_NAME
              value: ""

            - name: VM_PASSWORD
              value: ""

            - name: NETWORK_BANDWIDTH
              value: "1mbit"

            - name: BURST
              value: "2kb"

            - name: LIMIT
              value: "2mb"

            - name: MIN_BURST
              value: ""

            - name: PEAK_RATE
              value: ""

            - name: NETWORK_INTERFACE
              value: "ens160"

            - name: DESTINATION_HOSTS
              value: ""

            - name: DESTINATION_IPS
              value: ""

            - name: TOTAL_CHAOS_DURATION
              value: "30"

            - name: CHAOS_INTERVAL
              value: "30"

            - name: RAMP_TIME
              value: ""

            - name: GOVC_URL
              valueFrom:
                secretKeyRef:
                  name: vcenter-secret
                  key: VCENTERSERVER

            - name: SEQUENCE
              value: "parallel"

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: GOVC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vcenter-secret
                  key: VCENTERUSER

            - name: GOVC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vcenter-secret
                  key: VCENTERPASS

            - name: GOVC_INSECURE
              value: "true"
