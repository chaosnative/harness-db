---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    It injects chaos inside the VM which modifies the status code of the response from the provided application server to desired status code provided by the user and reverts after a specified duration
kind: ChaosExperiment
metadata:
  name: vmware-http-response-modify
  labels:
    name: vmware-http-response-modify
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      # Create and monitor the experiment & helper pods
      - apiGroups: [""]
        resources: ["pods"]
        verbs:
          [
            "create",
            "delete",
            "get",
            "list",
            "patch",
            "update",
            "deletecollection",
          ]
      # Performs CRUD operations on the events inside chaosengine and chaosresult
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      # Fetch configmaps details and mount it to the experiment pod (if specified)
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # Track and get the runner, experiment, and helper pods log
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get", "list", "watch"]
      # for creating and managing to execute commands inside target container
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["get", "list", "create"]
      # deriving the parent/owner details of the pod(if parent is anyof {deployment, statefulset, daemonsets})
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
        verbs: ["list", "get"]
      # deriving the parent/owner details of the pod(if parent is deploymentConfig)
      - apiGroups: ["apps.openshift.io"]
        resources: ["deploymentconfigs"]
        verbs: ["list", "get"]
      # deriving the parent/owner details of the pod(if parent is deploymentConfig)
      - apiGroups: [""]
        resources: ["replicationcontrollers"]
        verbs: ["get", "list"]
      # deriving the parent/owner details of the pod(if parent is argo-rollouts)
      - apiGroups: ["argoproj.io"]
        resources: ["rollouts"]
        verbs: ["list", "get"]
      # for configuring and monitor the experiment job by the chaos-runner pod
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create", "list", "get", "delete", "deletecollection"]
      # for creation, status polling and deletion of litmus chaos resources used within a chaos workflow
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name vmware-http-response-modify
    command:
      - /bin/bash
    env:

      # provide lib image
      - name: LIB_IMAGE
        value: 'chaosnative/go-runner:ci'

      # provide the http chaos type for modify response
      # accepted values are status_code, body, header
      - name: HTTP_CHAOS_TYPE
        value: 'status_code'

      # modified status code for the http response
      # if no value is provided, a random status code from the supported code list will selected
      # if an invalid status code is provided, the experiment will fail
      # supported status code list: [200, 201, 202, 204, 300, 301, 302, 304, 307, 400, 401, 403, 404, 500, 501, 502, 503, 504
      - name: STATUS_CODE
        value: ''

      #  whether to modify the body as per the status code provided
      - name: "MODIFY_RESPONSE_BODY"
        value: "true"

      # provide the body string to overwrite the response body
      - name: RESPONSE_BODY
        value: ''

      # map of headers to modify/add; Eg: {"X-Litmus-Test-Header": "X-Litmus-Test-Value"}
      # to remove a header, just set the value to ""; Eg: {"X-Litmus-Test-Header": ""}
      - name: HEADERS_MAP
        value: '{}'

      # whether to modify response headers or request headers. Accepted values: request, response
      - name: HEADER_MODE
        value: 'response'

      # port of the target service
      - name: TARGET_SERVICE_PORT
        value: "80"

      # port on which the proxy will listen
      - name: PROXY_PORT
        value: "8080"

      # network interface on which the proxy will listen
      - name: NETWORK_INTERFACE
        value: "ens160"

      - name: VM_NAME
        value: ''

      - name: VM_USER_NAME
        value: ''

      - name: VM_PASSWORD
        value: ''

      - name: TOTAL_CHAOS_DURATION
        value: '60' # in seconds

      - name: CHAOS_INTERVAL
        value: '60'

      # Time period to wait before and after injection of chaos in sec
      - name: RAMP_TIME
        value: ''

      # lib can be litmus or pumba
      - name: LIB
        value: 'litmus'

      ## it defines the sequence of chaos execution for multiple target vms
      ## supported values: serial, parallel
      - name: SEQUENCE
        value: 'parallel'

      - name: DEFAULT_HEALTH_CHECK
        value: 'false'

      - name: GOVC_URL
        valueFrom:
          secretKeyRef:
            name: vcenter-secret
            key: VCENTERSERVER

      - name: GOVC_USERNAME
        valueFrom:
          secretKeyRef:
            name: vcenter-secret
            key: VCENTERUSER

      - name: GOVC_PASSWORD
        valueFrom:
          secretKeyRef:
            name: vcenter-secret
            key: VCENTERPASS

      - name: GOVC_INSECURE
        value: 'true'

      # provide lib image
      - name: LIB_IMAGE
        value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2

      # provide the HTTP chaos type for modify response
      # accepted values are status_code, body, header
      - name: HTTP_CHAOS_TYPE
        value: "status_code"

      # modified status code for the HTTP response
      # if no value is provided, a random status code from the supported code list will selected
      # if an invalid status code is provided, the experiment will fail
      # supported status code list: [200, 201, 202, 204, 300, 301, 302, 304, 307, 400, 401, 403, 404, 500, 501, 502, 503, 504
      - name: STATUS_CODE
        value: ""

      #  whether to modify the body as per the status code provided
      - name: "MODIFY_RESPONSE_BODY"
        value: "true"

      # provide the body string to overwrite the response body
      - name: RESPONSE_BODY
        value: ""

      # map of headers to modify/add; Eg: {"X-Litmus-Test-Header": "X-Litmus-Test-Value"}
      # to remove a header, just set the value to ""; Eg: {"X-Litmus-Test-Header": ""}
      - name: HEADERS_MAP
        value: "{}"

      # whether to modify response headers or request headers. Accepted values: request, response
      - name: HEADER_MODE
        value: "response"

      # port of the target service
      - name: TARGET_SERVICE_PORT
        value: "80"

      # port on which the proxy will listen
      - name: PROXY_PORT
        value: "8080"

      # network interface on which the proxy will listen
      - name: NETWORK_INTERFACE
        value: "ens160"

      - name: VM_NAME
        value: ""

      - name: VM_USER_NAME
        value: ""

      - name: VM_PASSWORD
        value: ""

      - name: TOTAL_CHAOS_DURATION
        value: "60"

      - name: CHAOS_INTERVAL
        value: "60"

      # Time period to wait before and after injection of chaos in sec
      - name: RAMP_TIME
        value: ""

      ## it defines the sequence of chaos execution for multiple target vms
      ## supported values: serial, parallel
      - name: SEQUENCE
        value: "parallel"

      - name: DEFAULT_HEALTH_CHECK
        value: "false"

      - name: GOVC_URL
        valueFrom:
          secretKeyRef:
            name: vcenter-secret
            key: VCENTERSERVER

      - name: GOVC_USERNAME
        valueFrom:
          secretKeyRef:
            name: vcenter-secret
            key: VCENTERUSER

      - name: GOVC_PASSWORD
        valueFrom:
          secretKeyRef:
            name: vcenter-secret
            key: VCENTERPASS

      - name: GOVC_INSECURE
        value: "true"

    labels:
      name: vmware-http-response-modify
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
