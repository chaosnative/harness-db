---
apiVersion: litmuschaos.io/v1alpha1
kind: K8sFault
metadata:
  name: vmware-network-latency
spec:
  definition:
    chaos:
      experiment: vmware-network-latency
      serviceAccountName: litmus-admin
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-ddcr-faults:1.54.0
      imagePullPolicy: Always
      env:
        - name: TOTAL_CHAOS_DURATION
          value: "30" # in seconds

        - name: CHAOS_INTERVAL
          value: "10"

        - name: RAMP_TIME
          value: ""

        - name: GOVC_URL
          valueFrom:
            secretKeyRef:
              name: vcenter-secret
              key: VCENTERSERVER

        - name: GOVC_USERNAME
          valueFrom:
            secretKeyRef:
              name: vcenter-secret
              key: VCENTERUSER

        - name: GOVC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vcenter-secret
              key: VCENTERPASS

        - name: GOVC_INSECURE
          value: "true"

        - name: VM_NAME
          value: ""

        - name: VM_USER_NAME
          value: ""

        - name: VM_PASSWORD
          value: ""

        - name: NETWORK_INTERFACE
          value: "ens160"

        - name: NETWORK_LATENCY
          value: "2000"

        - name: JITTER
          value: ""

        - name: DESTINATION_HOSTS
          value: ""

        - name: DESTINATION_IPS
          value: ""

        - name: SOURCE_PORTS
          value: ""

        - name: DESTINATION_PORTS
          value: ""

        - name: SEQUENCE
          value: "parallel"
