---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    It injects the load chaos on the given target hosts for a specific chaos duration
kind: ChaosExperiment
metadata:
  name: k6-loadgen-chaos
  labels:
    name: k6-loadgen-chaos
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups:
          - ""
          - batch
          - litmuschaos.io
        resources:
          - jobs
          - pods
          - events
          - pods/log
          - pods/exec
          - secrets
          - chaosengines
          - chaosexperiments
          - chaosresults
        verbs:
          - create
          - list
          - get
          - patch
          - update
          - delete
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name k6-loadgen
    command:
      - /bin/bash
    env:
      - name: TOTAL_CHAOS_DURATION
        value: "60"
      - name: RAMP_TIME
        value: ""
      - name: SCRIPT_SECRET_NAME
        value: "k6-script"
      - name: SCRIPT_SECRET_KEY
        value: "script.js"
      - name: LOAD_IMAGE
        value: ghcr.io/grafana/k6-operator:latest-runner
    labels:
      name: k6-loadgen-chaos
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
