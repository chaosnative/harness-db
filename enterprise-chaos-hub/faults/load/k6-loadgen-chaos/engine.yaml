---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: k6-loadgen-chaos
  namespace: default
  labels:
    name: k6-loadgen-chaos
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
spec:
  engineState: "active"
  terminationGracePeriodSeconds: 30
  chaosServiceAccount: litmus-admin
  experiments:
    - name: k6-loadgen-chaos
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name k6-loadgen
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: RAMP_TIME
              value: ""
            - name: SCRIPT_SECRET_NAME
              value: "k6-script"
            - name: SCRIPT_SECRET_KEY
              value: "script.js"
            - name: LOAD_IMAGE
              value: ghcr.io/grafana/k6-operator:latest-runner
