---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-http-latency
  namespace: default
  labels:
    name: pod-http-latency
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  appinfo:
    appns: ""
    # FYI, To see app label, apply kubectl get pods --show-labels
    applabel: ""
    appkind: ""
  chaosServiceAccount: pod-http-latency-sa
  experiments:
    - name: pod-http-latency
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name pod-http-latency
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0

            - name: LATENCY
              value: "2000" #in ms

            # port of the target service
            - name: TARGET_SERVICE_PORT
              value: "80"

            # toxicity is the probability of the request to be affected
            # provide the percentage value in the range of 0-100
            # 0 means no request will be affected and 100 means all request will be affected
            - name: TOXICITY
              value: "100"

            # port on which the proxy will listen
            - name: PROXY_PORT
              value: "20000"

            # network interface on which the proxy will listen
            - name: NETWORK_INTERFACE
              value: "eth0"

            - name: TOTAL_CHAOS_DURATION
              value: "60" # in seconds

            # Time period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            # percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ""

            - name: TARGET_PODS
              value: ""

            # provide the name of container runtime
            # it supports docker, containerd, crio
            - name: CONTAINER_RUNTIME
              value: "containerd"

            # provide the socket file path
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

            # To select pods on specific node(s)
            - name: NODE_LABEL
              value: ""

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"
