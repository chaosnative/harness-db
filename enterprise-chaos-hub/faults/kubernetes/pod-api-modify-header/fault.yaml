---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    It injects chaos inside the pod to modifies the api request and response body. It replace all the content matched with the specified regex with the provided value
metadata:
  name: pod-api-modify-header
  labels:
    name: pod-api-modify-header
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      # Create and monitor the experiment & helper pods
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["create", "delete", "get", "list", "patch", "update", "deletecollection"]
      # Performs CRUD operations on the events inside chaosengine and chaosresult
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      # Fetch configmaps details and mount it to the experiment pod (if specified)
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list"]
      # Track and get the runner, experiment, and helper pods log
      - apiGroups: [""]
        resources: ["pods/log"]
        verbs: ["get", "list", "watch"]
      # for creating and managing to execute commands inside target container
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["get", "list", "create"]
      # deriving the parent/owner details of the pod(if parent is anyof {deployment, statefulset, daemonsets})
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
        verbs: ["list", "get"]
      # deriving the parent/owner details of the pod(if parent is deploymentConfig)
      - apiGroups: ["apps.openshift.io"]
        resources: ["deploymentconfigs"]
        verbs: ["list", "get"]
      # deriving the parent/owner details of the pod(if parent is deploymentConfig)
      - apiGroups: [""]
        resources: ["replicationcontrollers"]
        verbs: ["get", "list"]
      # deriving the parent/owner details of the pod(if parent is argo-rollouts)
      - apiGroups: ["argoproj.io"]
        resources: ["rollouts"]
        verbs: ["list", "get"]
      # for configuring and monitor the experiment job by the chaos-runner pod
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create", "list", "get", "delete", "deletecollection"]
      # for creation, status polling and deletion of litmus chaos resources used within a chaos workflow
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-api-modify-header
    command:
      - /bin/bash
    env:
      - name: TARGET_CONTAINER
        value: ''

      # provide lib image
      - name: LIB_IMAGE
        value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2

      # provide the header keys and values to be overridden
      - name: HEADERS_MAP
        value: ''

      # port of the target service
      - name: TARGET_SERVICE_PORT
        value: "80"

      # port on which the proxy will listen
      - name: PROXY_PORT
        value: "20000"

      # network interface on which the proxy will listen
      - name: NETWORK_INTERFACE
        value: "eth0"

      - name: TOTAL_CHAOS_DURATION
        value: '60' # in seconds

      # api path filter
      - name: PATH_FILTER
        value: ''

      # http headers filter
      - name: HEADERS_FILTERS
        value: ''

      # http methods filter
      - name: METHODS
        value: ''

      # query params filter
      - name: QUERY_PARAMS
        value: ''

      # source hosts filter for ingress traffic
      - name: SOURCE_HOSTS
        value: ''

      # source ips filter for ingress traffic
      - name: SOURCE_IPS
        value: ''

      # destination hosts filter for egress traffic
      - name: DESTINATION_HOSTS
        value: ''

      # destination ips filter for egress traffic
      - name: DESTINATION_IPS
        value: ''

      - name: SERVICE_DIRECTION
        value: 'ingress'

      - name: DATA_DIRECTION
        value: 'both'

      # Time period to wait before and after injection of chaos in sec
      - name: RAMP_TIME
        value: ''

      # enable the https for ingress and egress traffic
      - name: HTTPS_ENABLED
        value: ''

      # provide the base64 encoded custom certificates
      - name: CUSTOM_CERTIFICATES
        value: ''

      # provide the default root CA certificate path
      - name: HTTPS_ROOT_CERT_PATH
        value: '/etc/ssl/certs'

      # provide the default root CA certificate file name
      - name: HTTPS_ROOT_CERT_FILE_NAME
        value: 'ca-certificates.crt'

      # comma seperated destination ports
      - name: DESTINATION_PORTS
        value: ''

      # percentage of total pods to target
      - name: PODS_AFFECTED_PERC
        value: ''

      - name: TARGET_PODS
        value: ''

      # provide the name of container runtime
      # it supports docker, containerd, crio
      - name: CONTAINER_RUNTIME
        value: 'containerd'

      # provide the socket file path
      - name: SOCKET_PATH
        value: '/run/containerd/containerd.sock'

      # To select pods on specific node(s)
      - name: NODE_LABEL
        value: ''

      ## it defines the sequence of chaos execution for multiple target pods
      ## supported values: serial, parallel
      - name: SEQUENCE
        value: 'parallel'

    labels:
      name: pod-api-modify-header
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
