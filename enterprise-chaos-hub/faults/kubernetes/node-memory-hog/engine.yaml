---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: node-memory-hog
  namespace: default
  labels:
    name: node-memory-hog
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  #ex. values: ns1:name=percona,ns2:run=nginx
  auxiliaryAppInfo: ""
  chaosServiceAccount: node-memory-hog-sa
  experiments:
    - name: node-memory-hog
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name node-memory-hog
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"

            ## Specify the size as percent of total node capacity Ex: '30'
            ## NOTE: for selecting this option keep MEMORY_CONSUMPTION_MEBIBYTES empty
            - name: MEMORY_CONSUMPTION_PERCENTAGE
              value: "0"

            ## Specify the amount of memory to be consumed in mebibytes
            ## NOTE: for selecting this option keep MEMORY_CONSUMPTION_PERCENTAGE empty
            - name: MEMORY_CONSUMPTION_MEBIBYTES
              value: "0"

            - name: NUMBER_OF_WORKERS
              value: "1"

            # ENTER THE COMMA SEPARATED TARGET NODES NAME
            - name: TARGET_NODES
              value: ""

            - name: NODE_LABEL
              value: ""

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            ## percentage of total nodes to target
            - name: NODES_AFFECTED_PERC
              value: ""

            ## it defines the sequence of chaos execution for multiple target nodes
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"
