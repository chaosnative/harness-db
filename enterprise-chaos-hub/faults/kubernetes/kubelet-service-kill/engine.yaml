---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: kubelet-service-kill
  namespace: default
  labels:
    name: kubelet-service-kill
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/service-kill: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  #ex. values: ns1:name=percona,ns2:run=nginx
  auxiliaryAppInfo: ""
  chaosServiceAccount: kubelet-service-kill-sa
  experiments:
    - name: kubelet-service-kill
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name kubelet-service-kill
      command:
        - /bin/bash
      spec:
        components:
          # nodeSelector:
          #   # provide the node labels
          #   kubernetes.io/hostname: 'node02'
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60" # in seconds

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            - name: NODE_LABEL
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: "docker.io/chaosnative/chaos-ubuntu:16.04"

            # provide the target node name
            - name: TARGET_NODE
              value: ""

            - name: DEFAULT_HEALTH_CHECK
              value: "false"
