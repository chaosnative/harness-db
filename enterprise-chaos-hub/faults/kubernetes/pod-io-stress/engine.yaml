---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-io-stress
  namespace: default
  labels:
    name: pod-io-stress
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  appinfo:
    appns: ""
    applabel: ""
    appkind: ""
  chaosServiceAccount: pod-io-stress-sa
  experiments:
    - name: pod-io-stress
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name pod-io-stress
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"

            ## specify the size as percentage of free space on the file system
            ## default value 90 (in percentage)
            - name: FILESYSTEM_UTILIZATION_PERCENTAGE
              value: "10"

            ## we can specify the size in Gigabyte (Gb) also in place of percentage of free space
            ## NOTE: for selecting this option FILESYSTEM_UTILIZATION_PERCENTAGE should be empty
            - name: FILESYSTEM_UTILIZATION_BYTES
              value: ""

            ## Total number of workers default value is 4
            - name: NUMBER_OF_WORKERS
              value: "4"

            ## Percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ""

            # provide volume mount path
            - name: VOLUME_MOUNT_PATH
              value: ""

            - name: TARGET_CONTAINER
              value: ""

            ## specify the comma separated target pods
            - name: TARGET_PODS
              value: ""

            # To select pods on specific node(s)
            - name: NODE_LABEL
              value: ""

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            ## provide the cluster runtime
            - name: CONTAINER_RUNTIME
              value: "containerd"

            # provide the socket file path
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"
