---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-api-latency
  namespace: default
  labels:
    name: pod-api-latency
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: 'active'
  appinfo:
    appns: ''
    # FYI, To see app label, apply kubectl get pods --show-labels
    applabel: ''
    appkind: ''
  chaosServiceAccount: pod-api-latency-sa
  experiments:
    - name: pod-api-latency
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name pod-api-latency
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: ''

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0

            - name: LATENCY
              value: '2s' #in seconds

            # port of the target service
            - name: TARGET_SERVICE_PORT
              value: "80"

            # port on which the proxy will listen
            - name: PROXY_PORT
              value: "20000"

            # network interface on which the proxy will listen
            - name: NETWORK_INTERFACE
              value: "eth0"

            - name: TOTAL_CHAOS_DURATION
              value: '60' # in seconds

            # Time period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ''

            # enable the https for ingress and egress traffic
            - name: HTTPS_ENABLED
              value: ''

            # provide the base64 encoded custom certificates
            - name: CUSTOM_CERTIFICATES
              value: ''

            # provide the default root CA certificate path
            - name: HTTPS_ROOT_CERT_PATH
              value: '/etc/ssl/certs'

            # provide the default root CA certificate file name
            - name: HTTPS_ROOT_CERT_FILE_NAME
              value: 'ca-certificates.crt'

            # comma seperated destination ports
            - name: DESTINATION_PORTS
              value: ''

            # api path filter
            - name: PATH_FILTER
              value: '/status'

            # http headers filter
            - name: HEADERS_FILTERS
              value: ''

            # http methods filter
            - name: METHODS
              value: ''

            # query params filter
            - name: QUERY_PARAMS
              value: ''

            # source hosts filter for ingress traffic
            - name: SOURCE_HOSTS
              value: ''

            # source ips filter for ingress traffic
            - name: SOURCE_IPS
              value: ''

            # destination hosts filter for egress traffic
            - name: DESTINATION_HOSTS
              value: ''

            # destination ips filter for egress traffic
            - name: DESTINATION_IPS
              value: ''

            - name: SERVICE_DIRECTION
              value: 'ingress'

            - name: DATA_DIRECTION
              value: 'both'

            # percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ''

            - name: TARGET_PODS
              value: ''

            # provide the name of container runtime
            # it supports docker, containerd, crio
            - name: CONTAINER_RUNTIME
              value: 'containerd'

            # provide the socket file path
            - name: SOCKET_PATH
              value: '/run/containerd/containerd.sock'

            # To select pods on specific node(s)
            - name: NODE_LABEL
              value: ''

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: 'parallel'
