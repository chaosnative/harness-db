---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: container-kill
  namespace: default
  labels:
    name: container-kill
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  appinfo:
    appns: ""
    applabel: ""
    appkind: ""
  chaosServiceAccount: container-kill-sa
  experiments:
    - name: container-kill
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name container-kill
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: ""

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            - name: TARGET_PODS
              value: ""

            # provide the chaos interval
            - name: CHAOS_INTERVAL
              value: "10"

            - name: SIGNAL
              value: "SIGKILL"

            # provide the socket file path
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

            # provide the name of container runtime
            # it supports docker, containerd, crio
            - name: CONTAINER_RUNTIME
              value: "containerd"

            # provide the total chaos duration
            - name: TOTAL_CHAOS_DURATION
              value: "20"

            ## percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ""

            # To select pods on specific node(s)
            - name: NODE_LABEL
              value: ""

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"
