---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: node-restart
  namespace: default
  labels:
    name: node-restart
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  #ex. values: ns1:name=percona,ns2:run=nginx
  auxiliaryAppInfo: ""
  chaosServiceAccount: litmus-admin
  experiments:
    - name: node-restart
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name node-restart
      command:
        - /bin/bash
      spec:
        components:
          # nodeSelector:
          #   # provide the node labels
          #   kubernetes.io/hostname: 'node02'
          env:
            - name: SSH_USER
              value: "root"
            - name: REBOOT_COMMAND
              value: "sudo systemctl reboot; true"

            - name: TOTAL_CHAOS_DURATION
              value: "60"

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2

            # ENTER THE TARGET NODE NAME
            - name: TARGET_NODE
              value: ""

            - name: NODE_LABEL
              value: ""

            # ENTER THE TARGET NODE IP
            - name: TARGET_NODE_IP
              value: ""

            - name: DEFAULT_HEALTH_CHECK
              value: "false"
          secrets:
            - name: id-rsa
              mountPath: /mnt/
        probe:
          - name: healthcheck
            type: cmdProbe
            mode: Edge
            runProperties:
              probeTimeout: 180s
              retry: 0
              interval: 1s
              stopOnFailure: false
            cmdProbe/inputs:
              command: ./healthcheck -name node-level
              source:
                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                inheritInputs: true
              comparator:
                type: string
                criteria: contains
                value: "[P000]"
