---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-io-attribute-override
  namespace: default
  labels:
    name: pod-io-attribute-override
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  appinfo:
    appns: ""
    applabel: ""
    appkind: ""
  chaosServiceAccount: pod-io-attribute-override-sa
  experiments:
    - name: pod-io-attribute-override
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner-io:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name pod-io-attribute-override
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: '60'

            # file attributes and their values which needs to be overridden
            - name: ATTRIBUTES
              value: '{"perm": 72}'

            # volume mount path
            - name: MOUNT_PATH
              value: ''

            # path of the file or wildcard path
            - name: FILE_PATH
              value: ''

            # percentage of the i/o requested to be impacted
            - name: PERCENTAGE
              value: "100"

            # type of the method type i.e, read, write, open
            - name: METHOD_TYPES
              value: ''

            ## Percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ''

            ## Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ''

            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner-io:1.41.0

            ## provide the cluster runtime
            - name: CONTAINER_RUNTIME
              value: 'containerd'

            # provide the socket file path
            - name: SOCKET_PATH
              value: '/run/containerd/containerd.sock'

            - name: TARGET_CONTAINER
              value: ''

            - name: TARGET_PODS
              value: ''

            # To select pods on specific node(s)
            - name: NODE_LABEL
              value: ''

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: 'parallel'
