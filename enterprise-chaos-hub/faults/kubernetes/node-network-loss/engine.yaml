---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: node-network-loss
  namespace: default
  labels:
    name: node-network-loss
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  #ex. values: ns1:name=percona,ns2:run=nginx
  auxiliaryAppInfo: ""
  chaosServiceAccount: litmus-admin
  experiments:
    - name: node-network-loss
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name node-network-loss
      command:
        - /bin/bash
      spec:
        components:
          statusCheckTimeouts:
            delay: 2
            timeout: 600
          # nodeSelector:
          #   # provide the node labels
          #   kubernetes.io/hostname: 'node02'
          env:
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: TARGET_CONTAINER
              value: ""
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
            - name: NETWORK_INTERFACE
              value: eth0
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: RAMP_TIME
              value: ""
            - name: TARGET_NODES
              value: ""
            - name: NODES_AFFECTED_PERC
              value: ""
            - name: NODE_LABEL
              value: ""
            - name: DESTINATION_IPS
              value: ""
            - name: DESTINATION_HOSTS
              value: ""
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"
            - name: SEQUENCE
              value: parallel
            - name: DEFAULT_HEALTH_CHECK
              value: "false"
