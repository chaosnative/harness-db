---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-dns-error
  labels:
    experiment: pod-dns-error
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  appinfo:
    appns: ""
    applabel: ""
    appkind: ""
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  #ex. values: ns1:name=percona,ns2:run=nginx
  auxiliaryAppInfo: ""
  chaosServiceAccount: pod-dns-error-sa
  experiments:
    - name: pod-dns-error
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
      args:
        - -c
        - ./experiments -name pod-dns-error
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TARGET_CONTAINER
              value: ""

            # provide lib image
            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: TOTAL_CHAOS_DURATION
              value: "60" # in seconds

            # Time period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            ## percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ""

            - name: TARGET_PODS
              value: ""

            # provide the name of container runtime, it supports docker, containerd, crio
            - name: CONTAINER_RUNTIME
              value: "containerd"

            # provide the socket file path
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"

            # list of the target hostnames or kewywords eg. '["litmuschaos","chaosnative.io"]' . If empty all hostnames are targets
            - name: TARGET_HOSTNAMES
              value: ""

            # can be either exact or substring, determines whether the DNS query has to match exactly with one of the targets or can have any of the targets as substring
            - name: MATCH_SCHEME
              value: "exact"
        probe:
          - name: healthcheck
            type: cmdProbe
            mode: Edge
            runProperties:
              probeTimeout: 180s
              retry: 0
              interval: 1s
              stopOnFailure: false
            cmdProbe/inputs:
              command: ./healthcheck -name pod-level
              source:
                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                inheritInputs: true
              comparator:
                type: string
                criteria: contains
                value: "[P000]"
