---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-memory-hog
  namespace: default
  labels:
    name: pod-memory-hog
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/runtime-api-usage: "true"
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  appinfo:
    appns: ""
    applabel: ""
    appkind: ""
  chaosServiceAccount: pod-memory-hog-sa
  experiments:
    - name: pod-memory-hog
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name pod-memory-hog
      command:
        - /bin/bash
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"

            ## enter the amount of memory in megabytes to be consumed by the application pod
            - name: MEMORY_CONSUMPTION
              value: "500"

            ## Number of workers to perform stress
            - name: NUMBER_OF_WORKERS
              value: "1"

            ## percentage of total pods to target
            - name: PODS_AFFECTED_PERC
              value: ""

            ## Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            - name: LIB_IMAGE
              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0

            ## provide the cluster runtime
            - name: CONTAINER_RUNTIME
              value: "containerd"

            # provide the socket file path
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"

            ## it defines the sequence of chaos execution for multiple target pods
            ## supported values: serial, parallel
            - name: SEQUENCE
              value: "parallel"

            - name: DEFAULT_HEALTH_CHECK
              value: "false"

            - name: TARGET_CONTAINER
              value: ""

            - name: TARGET_PODS
              value: ""

            # To select pods on specific node(s)
            - name: NODE_LABEL
              value: ""
