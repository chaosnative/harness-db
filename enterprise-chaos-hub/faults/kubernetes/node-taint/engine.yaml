---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: node-taint
  namespace: default
  labels:
    name: node-taint
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: experiment-job
    app.kubernetes.io/version: ci
spec:
  # It can be active/stop
  engineState: "active"
  terminationGracePeriodSeconds: 30
  #ex. values: ns1:name=percona,ns2:run=nginx
  auxiliaryAppInfo: ""
  chaosServiceAccount: node-taint-sa
  experiments:
    - name: node-taint
      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
      imagePullPolicy: Always
      args:
        - -c
        - ./experiments -name node-taint
      command:
        - /bin/bash
      spec:
        components:
          # nodeSelector:
          #   # provide the node labels
          #   kubernetes.io/hostname: 'node02'
          env:
            - name: TARGET_NODE
              value: ""

            - name: NODE_LABEL
              value: ""

            - name: TOTAL_CHAOS_DURATION
              value: "60"

            # Period to wait before and after injection of chaos in sec
            - name: RAMP_TIME
              value: ""

            # set taint label & effect
            # key=value:effect or key:effect
            - name: TAINTS
              value: "app.hce.io/chaos=true:NoSchedule"

            - name: DEFAULT_HEALTH_CHECK
              value: "false"
