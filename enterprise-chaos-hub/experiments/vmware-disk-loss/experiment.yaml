---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: vmware-disk-loss-1658234777
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: vmware-disk-loss-ph4
            template: vmware-disk-loss-ph4
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: vmware-disk-loss-ph4
      inputs:
        artifacts:
          - name: vmware-disk-loss-ph4
            path: /tmp/chaosengine-vmware-disk-loss-ph4.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  generateName: vmware-disk-loss-ph4
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  labels:
                    name: vmware-disk-loss
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: vmware-disk-loss
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name vmware-disk-loss
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: VCENTERSERVER
                              valueFrom:
                                secretKeyRef:
                                  name: vcenter-secret
                                  key: VCENTERSERVER
                            - name: VCENTERUSER
                              valueFrom:
                                secretKeyRef:
                                  name: vcenter-secret
                                  key: VCENTERUSER
                            - name: VCENTERPASS
                              valueFrom:
                                secretKeyRef:
                                  name: vcenter-secret
                                  key: VCENTERPASS
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                            - name: VIRTUAL_DISK_NAMES
                              value: ""
                            - name: APP_VM_MOIDS
                              value: ""
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-vmware-disk-loss-ph4.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (acafcdd5-61b7-445a-a473-78ea1a9983d9, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
