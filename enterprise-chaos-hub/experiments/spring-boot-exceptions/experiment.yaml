---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: spring-boot-exceptions-1658939319
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: spring-boot-exceptions-t3s
            template: spring-boot-exceptions-t3s
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: spring-boot-exceptions-t3s
      inputs:
        artifacts:
          - name: spring-boot-exceptions-t3s
            path: /tmp/chaosengine-spring-boot-exceptions-t3s.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: spring-boot-exceptions-t3s
                  labels:
                    name: spring-boot-exceptions
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  appinfo:
                    appns: default
                    applabel: app=spring-boot
                    appkind: deployment
                  # It can be active/stop
                  engineState: 'active'
                  chaosServiceAccount: litmus-admin
                  experiments:
                  - name: spring-boot-exceptions
                    image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                    imagePullPolicy: Always
                    args:
                    - -c
                    - ./experiments -name spring-boot-exceptions
                    command:
                    - /bin/bash
                    spec:
                      components:
                        env:
                          # Type of raised exception
                          - name: CM_EXCEPTIONS_TYPE
                            value: 'java.lang.IllegalArgumentException'
                          # Argument of raised exception
                          - name: CM_EXCEPTIONS_ARGUMENTS
                            value: 'java.lang.String:custom illegal argument exception'
                          # port of the spring boot application
                          - name: CM_PORT
                            value: ''
                          #it contains number of requests are to be attacked
                          # n value means nth request will be affected
                          - name: CM_LEVEL
                            value: '1'
                          # it limits watched packages/classes/methods
                          - name: CM_WATCHED_CUSTOM_SERVICES
                            value: ''
                          # provide name of watcher
                          # it supports controller, restController, service, repository, component, webClient
                          - name: CM_WATCHERS
                            value: 'restController'
                          - name: TOTAL_CHAOS_DURATION
                            value: '30'
                          ## percentage of total pods to target
                          - name: PODS_AFFECTED_PERC
                            value: ''
                          ## Period to wait before and after injection of chaos
                          - name: RAMP_TIME
                            value: ''
                          ## it defines the sequence of chaos execution for multiple target pods
                          ## supported values: serial, parallel
                          - name: SEQUENCE
                            value: 'parallel'
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-spring-boot-exceptions-t3s.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (9cf6250c-8173-4c98-b6de-f7147f13e4e2, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
