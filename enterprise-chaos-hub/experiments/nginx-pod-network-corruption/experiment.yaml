---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: pod-network-corruption-1658948179
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: pod-network-corruption-sr4
            template: pod-network-corruption-sr4
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: pod-network-corruption-sr4
      inputs:
        artifacts:
          - name: pod-network-corruption-sr4
            path: /tmp/chaosengine-pod-network-corruption-sr4.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: pod-network-corruption-sr4
                  labels:
                    name: pod-network-corruption
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/runtime-api-usage: "true"
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  appinfo:
                    appns: default
                    applabel: app=nginx
                    appkind: deployment
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: pod-network-corruption
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name pod-network-corruption
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TARGET_CONTAINER
                              value: ""
                            - name: LIB_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                            - name: NETWORK_INTERFACE
                              value: eth0
                            - name: TC_IMAGE
                              value: gaiadocker/iproute2
                            - name: NETWORK_PACKET_CORRUPTION_PERCENTAGE
                              value: "100"
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: RAMP_TIME
                              value: ""
                            - name: PODS_AFFECTED_PERC
                              value: ""
                            - name: TARGET_PODS
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: CONTAINER_RUNTIME
                              value: 'containerd'
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                            - name: DESTINATION_IPS
                              value: ""
                            - name: DESTINATION_HOSTS
                              value: ""
                            - name: SOCKET_PATH
                              value: '/run/containerd/containerd.sock'
                            - name: SEQUENCE
                              value: parallel
                        probe:
                          - name: healthcheck
                            type: cmdProbe
                            mode: Edge
                            runProperties:
                              probeTimeout: 180s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: ./healthcheck -name pod-level
                              source:
                                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                                inheritInputs: true
                              comparator:
                                type: string
                                criteria: contains
                                value: "[P000]"
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-pod-network-corruption-sr4.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (33a070eb-93cf-4f7d-af2a-ee763686b3a6, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
