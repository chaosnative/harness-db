---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: node-io-stress-1658469721
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: node-io-stress-15m
            template: node-io-stress-15m
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: node-io-stress-15m
      inputs:
        artifacts:
          - name: node-io-stress-15m
            path: /tmp/chaosengine-node-io-stress-15m.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: node-io-stress-15m
                  labels:
                    name: node-io-stress
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  auxiliaryAppInfo: ""
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: node-io-stress
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name node-io-stress
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: FILESYSTEM_UTILIZATION_PERCENTAGE
                              value: "40"
                            - name: FILESYSTEM_UTILIZATION_BYTES
                              value: ""
                            - name: CPU
                              value: "1"
                            - name: NUMBER_OF_WORKERS
                              value: "4"
                            - name: VM_WORKERS
                              value: "1"
                            - name: TARGET_NODES
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: RAMP_TIME
                              value: ""
                            - name: LIB_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                            - name: NODES_AFFECTED_PERC
                              value: ""
                            - name: SEQUENCE
                              value: parallel
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                        probe:
                          - name: healthcheck
                            type: cmdProbe
                            mode: Edge
                            runProperties:
                              probeTimeout: 180s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: ./healthcheck -name node-level
                              source:
                                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                                inheritInputs: true
                              comparator:
                                type: string
                                criteria: contains
                                value: "[P000]"
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-node-io-stress-15m.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (d85f69a8-27e0-46dc-b62d-f33e2b1a70ce, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
