---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: azure-instance-io-stress-1658860691
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: azure-instance-io-stress-uz0
            template: azure-instance-io-stress-uz0
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: azure-instance-io-stress-uz0
      inputs:
        artifacts:
          - name: azure-instance-io-stress-uz0
            path: /tmp/chaosengine-azure-instance-io-stress-uz0.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: azure-instance-io-stress-uz0
                  labels:
                    name: azure-instance-io-stress
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: azure-instance-io-stress
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name azure-instance-io-stress
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: AZURE_INSTANCE_NAMES
                              value: ""
                            - name: RESOURCE_GROUP
                              value: ""
                            - name: SCALE_SET
                              value: ""
                            - name: FILESYSTEM_UTILIZATION_BYTES
                              value: "5"
                            - name: FILESYSTEM_UTILIZATION_PERCENTAGE
                              value: "0"
                            - name: NUMBER_OF_WORKERS
                              value: "1"
                            - name: VOLUME_MOUNT_PATH
                              value: /tmp
                            - name: AZURE_AUTH_LOCATION
                              value: /tmp/azure.auth
                            - name: SEQUENCE
                              value: parallel
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-azure-instance-io-stress-uz0.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (018679e7-60da-4198-8e92-e9db98baeb3c, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
