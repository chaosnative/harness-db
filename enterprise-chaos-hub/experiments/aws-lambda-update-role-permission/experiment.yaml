---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: aws-lambda-update-role-permission

spec:
  templates:
    - name: aws-lambda-update-role-permission
      steps:
        - - name: lambda-update-role-permission-jjf
            template: lambda-update-role-permission-jjf

        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - sh
          - -c
        args:
          - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n
            {{workflow.parameters.adminModeNamespace}}

    - name: lambda-update-role-permission-jjf
      inputs:
        artifacts:
          - name: lambda-update-role-permission-jjf
            path: /tmp/chaosengine-lambda-update-role-permission-jjf.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: lambda-update-role-permission-jjf
                  labels:
                    name: lambda-update-role-permission
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/enableAWSAccessViaSecrets: disable
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: lambda-update-role-permission
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name lambda-update-role-permission
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: FUNCTION_NAME
                              value: ""
                            - name: POLICY_ARN
                              value: ""
                            - name: ROLE_ARN
                              value: ""
                            - name: REGION
                              value: ""
                            - name: SEQUENCE
                              value: "parallel"
                            - name: AWS_SHARED_CREDENTIALS_FILE
                              value: /tmp/cloud_config.yml
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                        probe:
                          - name: healthcheck
                            type: cmdProbe
                            mode: Edge
                            runProperties:
                              probeTimeout: 5s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: ./healthcheck -name lambda-update-function
                              source:
                                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                                inheritInputs: true
                                volumeMount:
                                  - mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                                    name: aws-iam-token
                                    readOnly: true
                                volumes:
                                  - name: aws-iam-token
                                    projected:
                                      defaultMode: 420
                                      sources:
                                        - serviceAccountToken:
                                            audience: sts.amazonaws.com
                                            expirationSeconds: 86400
                                            path: token
                              comparator:
                                type: string
                                criteria: contains
                                value: "[P000]"
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-lambda-update-role-permission-jjf.yaml
          - -saveName=/tmp/engine-name
  entrypoint: aws-lambda-update-role-permission
  arguments:
    parameters:
      - name: adminModeNamespace
        value: hce
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
status:
  startedAt: null
  finishedAt: null
