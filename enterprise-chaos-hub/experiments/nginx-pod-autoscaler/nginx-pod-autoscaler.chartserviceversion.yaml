---
apiVersion: litmuschaos.io/v1alpha1
kind: ChartServiceVersion
metadata:
  name: nginx-pod-autoscaler
  version: 0.1.0
  annotations:
    categories: nginx-pod-autoscaler
    chartDescription: Injects pod scale on the workload identified by the specified label ("app=nginx" by default)
spec:
  displayName: Nginx Pod Autoscaler
  categoryDescription: >
    Injects pod scale on the workload identified by the specified label ("app=nginx" by default)
  faults:
    - name: pod-autoscaler
      description: Injects pod scale on the workload identified by the specified label ("app=nginx" by default)
  keywords:
    - Kubernetes
  plan:
    - free
  platforms:
    - GKE
    - Packet(Kubeadm)
    - Minikube
    - EKS
    - AKS
    - Kind
  icon:
    - url:
      mediatype: ""
