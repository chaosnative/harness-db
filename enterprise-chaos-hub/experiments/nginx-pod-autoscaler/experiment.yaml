---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: pod-auto-scaler
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: pod-autoscaler-hvx
            template: pod-autoscaler-hvx

        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: pod-autoscaler-hvx
      inputs:
        artifacts:
          - name: pod-autoscaler-hvx
            path: /tmp/chaosengine-pod-autoscaler-hvx.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: pod-autoscaler-hvx
                  labels:
                    name: pod-autoscaler
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  auxiliaryAppInfo: ""
                  appinfo:
                    appns: default
                    applabel: app=nginx
                    appkind: deployment
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: pod-autoscaler
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name pod-autoscaler
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: RAMP_TIME
                              value: ""
                            - name: REPLICA_COUNT
                              value: "5"
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-pod-autoscaler-hvx.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (b43cc7bc-b061-4b5e-94ed-c38c812cb119, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
