---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: disk-fill-1658589493
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: disk-fill-i1k
            template: disk-fill-i1k
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
    - name: disk-fill-i1k
      inputs:
        artifacts:
          - name: disk-fill-i1k
            path: /tmp/chaosengine-disk-fill-i1k.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: disk-fill-i1k
                  labels:
                    name: disk-fill
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/host-path-usage: "true"
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  auxiliaryAppInfo: ""
                  appinfo:
                    appns: default
                    applabel: app=nginx
                    appkind: deployment
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: disk-fill
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name disk-fill
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TARGET_CONTAINER
                              value: ""
                            - name: FILL_PERCENTAGE
                              value: "80"
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: RAMP_TIME
                              value: ""
                            - name: DATA_BLOCK_SIZE
                              value: "256"
                            - name: TARGET_PODS
                              value: ""
                            - name: EPHEMERAL_STORAGE_MEBIBYTES
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: PODS_AFFECTED_PERC
                              value: ""
                            - name: LIB_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                            - name: SEQUENCE
                              value: parallel
                            - name: CONTAINER_RUNTIME
                              value: containerd
                            - name: SOCKET_PATH
                              value: /run/containerd/containerd.sock
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-disk-fill-i1k.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (c1372d10-4909-4762-90a7-a934a4682322, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
