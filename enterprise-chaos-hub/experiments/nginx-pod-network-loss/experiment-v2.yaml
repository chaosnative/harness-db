        targets:
          selectors:
            workloads:
              - kind: deployment
                namespace: default
                names: nginx
                labels: ''
            pods: null
        chaos:
          cleanupPolicy: ''
          experiment: pod-network-loss
          image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-ddcr-faults:1.54.0
          imagePullPolicy: Always
          labels: null
          annotations: null
          command: null
          args: null
          serviceAccountName: litmus-admin
          defaultHealthCheck: false
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
