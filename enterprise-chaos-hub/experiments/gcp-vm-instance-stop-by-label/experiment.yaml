---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: gcp-vm-instance-stop-by-label-1658953538
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: gcp-vm-instance-stop-by-label-jq6
            template: gcp-vm-instance-stop-by-label-jq6
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
    - name: gcp-vm-instance-stop-by-label-jq6
      inputs:
        artifacts:
          - name: gcp-vm-instance-stop-by-label-jq6
            path: /tmp/chaosengine-gcp-vm-instance-stop-by-label-jq6.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  generateName: gcp-vm-instance-stop-by-label-jq6
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  labels:
                    name: gcp-vm-instance-stop-by-label
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: gcp-vm-instance-stop-by-label
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name gcp-vm-instance-stop-by-label
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: SEQUENCE
                              value: parallel
                            - name: GCP_PROJECT_ID
                              value: ""
                            - name: INSTANCE_LABEL
                              value: ""
                            - name: ZONES
                              value: ""
                            - name: MANAGED_INSTANCE_GROUP
                              value: disable
                            - name: INSTANCE_AFFECTED_PERC
                              value: ""
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-gcp-vm-instance-stop-by-label-jq6.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (8faba4a0-ebb6-4778-9c50-afbe75026459, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
