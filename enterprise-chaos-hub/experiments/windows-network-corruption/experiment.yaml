spec:
  infraType: "windows"
  steps:
    - - name: windows-network-corruption-4ap
  tasks:
    - name: windows-network-corruption-4ap
      infraId: ""
      definition:
        chaos:
          fault: windows-network-corruption
          env:
            - name: NETWORK_PACKET_CORRUPTION_PERCENTAGE
              value: "100"
            - name: DESTINATION_HOSTS
              value: ""
            - name: DESTINATION_IPS
              value: ""
            - name: DURATION
              value: "60s"
            - name: RAMP_TIME
              value: ""
