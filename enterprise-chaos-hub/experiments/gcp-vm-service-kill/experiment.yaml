---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: gcp-vm-service-kill
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: gcp-vm-service-kill-jxr
            template: gcp-vm-service-kill-jxr
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
    - name: gcp-vm-service-kill-jxr
      inputs:
        artifacts:
          - name: gcp-vm-service-kill-jxr
            path: /tmp/chaosengine-gcp-vm-service-kill-jxr.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: gcp-vm-service-kill-jxr
                  labels:
                    name: gcp-vm-service-kill
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/service-kill: "true"
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  auxiliaryAppInfo: ""
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: gcp-vm-service-kill
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name gcp-vm-service-kill
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "90"
                            - name: RAMP_TIME
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: SERVICE_NAME
                              value: 'containerd'
                            - name: MASK
                              value: 'disable'
                            - name: VM_USERNAME
                              value: ''
                            - name: GCP_PROJECT_ID
                              value: ''
                            - name: VM_INSTANCE_NAME
                              value: ""
                            - name: SUDO_ENABLED
                              value: 'true'
                            - name: LIB_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-gcp-vm-service-kill-jxr.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (c12e9aa0-dd99-4d1c-8f7d-1ba5e046f47d, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
