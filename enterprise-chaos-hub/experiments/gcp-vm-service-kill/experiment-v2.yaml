    - name: gcp-vm-service-kill-qgr2u
      definition:
        targets:
          appinfo:
          selectors:
            workloads:
            pods:
        chaos:
          experiment: gcp-vm-service-kill
          image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-ddcr-faults:1.54.0
