---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: custom-chaos-scenario-1659002276
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: azure-instance-stop-zyq
            template: azure-instance-stop-zyq
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
    - name: azure-instance-stop-zyq
      inputs:
        artifacts:
          - name: azure-instance-stop-zyq
            path: /tmp/chaosengine-azure-instance-stop-zyq.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: azure-instance-stop-zyq
                  labels:
                    name: azure-instance-stop
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: azure-instance-stop
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name azure-instance-stop
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: AZURE_INSTANCE_NAMES
                              value: ""
                            - name: RESOURCE_GROUP
                              value: ""
                            - name: SCALE_SET
                              value: ""
                            - name: AZURE_AUTH_LOCATION
                              value: /tmp/azure.auth
                            - name: SEQUENCE
                              value: parallel
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-azure-instance-stop-zyq.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (94c7da25-fa04-4337-aafa-0eb294dbcbac, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
