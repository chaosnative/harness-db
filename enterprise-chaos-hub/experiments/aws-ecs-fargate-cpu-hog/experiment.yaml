---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: ecs-fargate-cpu-hog

spec:
  templates:
    - name: ecs-fargate-cpu-hog
      steps:
        - - name: ecs-fargate-cpu-hog-y7j
            template: ecs-fargate-cpu-hog-y7j

        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - sh
          - -c
        args:
          - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n
            {{workflow.parameters.adminModeNamespace}}

    - name: ecs-fargate-cpu-hog-y7j
      inputs:
        artifacts:
          - name: ecs-fargate-cpu-hog-y7j
            path: /tmp/chaosengine-ecs-fargate-cpu-hog-y7j.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: ecs-fargate-cpu-hog-y7j
                  labels:
                    name: ecs-fargate-cpu-hog
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/enableAWSAccessViaSecrets: disable
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: ecs-fargate-cpu-hog
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name ecs-fargate-cpu-hog
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: CLUSTER_NAME
                              value: ""
                            - name: SERVICE_NAME
                              value: ""
                            - name: CPU_CORE
                              value: "2"
                            - name: CONTAINER_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                            - name: REGION
                              value: ""
                            - name: TASK_REPLICA_AFFECTED_PERC
                              value: '100'
                            - name: AWS_SHARED_CREDENTIALS_FILE
                              value: /tmp/cloud_config.yml
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                        probe:
                          - name: healthcheck
                            type: cmdProbe
                            mode: Edge
                            runProperties:
                              probeTimeout: 5s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: ./healthcheck -name aws-ecs-task-check
                              source:
                                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                                inheritInputs: true
                                volumeMount:
                                  - mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                                    name: aws-iam-token
                                    readOnly: true
                                volumes:
                                  - name: aws-iam-token
                                    projected:
                                      defaultMode: 420
                                      sources:
                                        - serviceAccountToken:
                                            audience: sts.amazonaws.com
                                            expirationSeconds: 86400
                                            path: token
                              comparator:
                                type: string
                                criteria: contains
                                value: "[P000]"
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-ecs-fargate-cpu-hog-y7j.yaml
          - -saveName=/tmp/engine-name

  entrypoint: ecs-fargate-cpu-hog
  arguments:
    parameters:
      - name: adminModeNamespace
        value: hce
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
status:
  startedAt: null
  finishedAt: null
