---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: azure-instance-memory-hog-1658859941
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: azure-instance-memory-hog-uz0
            template: azure-instance-memory-hog-uz0
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: azure-instance-memory-hog-uz0
      inputs:
        artifacts:
          - name: azure-instance-memory-hog-uz0
            path: /tmp/chaosengine-azure-instance-memory-hog-uz0.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: azure-instance-memory-hog-uz0
                  labels:
                    name: azure-instance-memory-hog
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: azure-instance-memory-hog
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name azure-instance-memory-hog
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: AZURE_INSTANCE_NAMES
                              value: ""
                            - name: RESOURCE_GROUP
                              value: ""
                            - name: SCALE_SET
                              value: ""
                            - name: MEMORY_CONSUMPTION
                              value: "500"
                            - name: MEMORY_PERCENTAGE
                              value: "0"
                            - name: NUMBER_OF_WORKERS
                              value: "2"
                            - name: AZURE_AUTH_LOCATION
                              value: /tmp/azure.auth
                            - name: SEQUENCE
                              value: parallel
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                        probe:
                          - name: healthcheck
                            type: cmdProbe
                            mode: Edge
                            runProperties:
                              probeTimeout: 5s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: ./healthcheck -name azure-vm
                              source:
                                image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
                                inheritInputs: true
                              comparator:
                                type: string
                                criteria: contains
                                value: "[P000]"
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-azure-instance-memory-hog-uz0.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.38.2
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (018679e7-60da-4198-8e92-e9db98baeb3c, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
