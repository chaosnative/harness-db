---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: pod-network-rate-limit-1658833497
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: pod-network-rate-limit-j4p
            template: pod-network-rate-limit-j4p
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: pod-network-rate-limit-j4p
      inputs:
        artifacts:
          - name: pod-network-rate-limit-j4p
            path: /tmp/chaosengine-pod-network-rate-limit-j4p.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: pod-network-rate-limit-j4p
                  labels:
                    name: pod-network-rate-limit
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/runtime-api-usage: "true"
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  appinfo:
                    appns: default
                    applabel: app=nginx
                    appkind: deployment
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: pod-network-rate-limit
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name pod-network-rate-limit
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TARGET_CONTAINER
                              value: ""
                            - name: LIB_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                            - name: NETWORK_INTERFACE
                              value: eth0
                            - name: NETWORK_BANDWIDTH
                              value: "1mbit"
                            - name: BURST
                              value: "32kb"
                            - name: LIMIT
                              value: "2mb"
                            - name: MIN_BURST
                              value: ""
                            - name: PEAK_RATE
                              value: ""
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: RAMP_TIME
                              value: ""
                            - name: PODS_AFFECTED_PERC
                              value: ""
                            - name: TARGET_PODS
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: CONTAINER_RUNTIME
                              value: 'containerd'
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                            - name: DESTINATION_IPS
                              value: ""
                            - name: DESTINATION_HOSTS
                              value: ""
                            - name: SOCKET_PATH
                              value: '/run/containerd/containerd.sock'
                            - name: SEQUENCE
                              value: parallel
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-pod-network-rate-limit-j4p.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (c6ad0474-786b-4cf0-84e0-37b7b7067256, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
