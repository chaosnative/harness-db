---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: node-restart
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: node-restart-1yp
            template: node-restart-1yp

        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: node-restart-1yp
      inputs:
        artifacts:
          - name: node-restart-1yp
            path: /tmp/chaosengine-node-restart-1yp.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: node-restart-1yp
                  labels:
                    name: node-restart
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  auxiliaryAppInfo: ""
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: node-restart
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name node-restart
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: SSH_USER
                              value: root
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: RAMP_TIME
                              value: ""
                            - name: LIB_IMAGE
                              value: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                            - name: TARGET_NODE
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: TARGET_NODE_IP
                              value: ""
                            - name: REBOOT_COMMAND
                              value: sudo systemctl reboot; true
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: id-rsa
                              mountPath: /mnt/
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-node-restart-1yp.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (e29ecea0-2c38-475d-9452-34da88bdd32b, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
