---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: nlb-az-down
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: nlb-az-down-1ap
            template: nlb-az-down-1ap
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
    - name: nlb-az-down-1ap
      inputs:
        artifacts:
          - name: nlb-az-down-1ap
            path: /tmp/chaosengine-nlb-az-down-1ap.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: nlb-az-down-1ap
                  labels:
                    name: nlb-az-down
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/enableAWSAccessViaSecrets: disable
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: nlb-az-down
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name nlb-az-down
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: LOAD_BALANCER_ARN
                              value: ""
                            - name: REGION
                              value: ""
                            - name: SEQUENCE
                              value: parallel
                            - name: ZONES
                              value: ""
                            - name: AWS_SHARED_CREDENTIALS_FILE
                              value: /tmp/cloud_config.yml
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                          projectedVolumes:
                            - name: aws-iam-token
                              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                              readOnly: true
                              projected:
                                defaultMode: 420
                                sources:
                                  - serviceAccountToken:
                                      audience: sts.amazonaws.com
                                      expirationSeconds: 86400
                                      path: token
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-nlb-az-down-1ap.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (6c836c65-aaa8-44d6-8b83-9a481bb1c99f, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
