---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: aws-ebs-loss-by-tag-1658952540
  namespace: litmus
spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: ebs-loss-by-tag-hn2
            template: ebs-loss-by-tag-hn2
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: ebs-loss-by-tag-hn2
      inputs:
        artifacts:
          - name: ebs-loss-by-tag-hn2
            path: /tmp/chaosengine-ebs-loss-by-tag-hn2.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: ebs-loss-by-tag-hn2
                  labels:
                    name: ebs-loss-by-tag
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/enableAWSAccessViaSecrets: disable
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: ebs-loss-by-tag
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name ebs-loss-by-tag
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: EBS_VOLUME_TAG
                              value: ""
                            - name: REGION
                              value: ""
                            - name: SEQUENCE
                              value: parallel
                            - name: VOLUME_AFFECTED_PERC
                              value: ""
                            - name: AWS_SHARED_CREDENTIALS_FILE
                              value: /tmp/cloud_config.yml
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                          projectedVolumes:
                            - name: aws-iam-token
                              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                              readOnly: true
                              projected:
                                defaultMode: 420
                                sources:
                                  - serviceAccountToken:
                                      audience: sts.amazonaws.com
                                      expirationSeconds: 86400
                                      path: token

      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-ebs-loss-by-tag-hn2.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.54.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (09dfe235-4cc1-49f0-91fe-961ec45db2be, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
