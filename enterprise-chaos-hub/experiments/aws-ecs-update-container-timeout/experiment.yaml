---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: ecs-update-container-timeout

spec:
  templates:
    - name: ecs-update-container-timeout
      steps:
        - - name: ecs-update-container-timeout-y7j
            template: ecs-update-container-timeout-y7j

        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n
            {{workflow.parameters.adminModeNamespace}}

    - name: ecs-update-container-timeout-y7j
      inputs:
        artifacts:
          - name: ecs-update-container-timeout-y7j
            path: /tmp/chaosengine-ecs-update-container-timeout-y7j.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: ecs-update-container-timeout-y7j
                  labels:
                    name: ecs-update-container-timeout
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/enableAWSAccessViaSecrets: disable
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: ecs-update-container-timeout
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name ecs-update-container-timeout
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: CLUSTER_NAME
                              value: ""
                            - name: SERVICE_NAME
                              value: ""
                            - name: START_TIMEOUT
                              value: '30'
                            - name: STOP_TIMEOUT
                              value: '30'
                            - name: REGION
                              value: ""
                            - name: TASK_REPLICA_AFFECTED_PERC
                              value: '100'
                            - name: AWS_SHARED_CREDENTIALS_FILE
                              value: /tmp/cloud_config.yml
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                          projectedVolumes:
                            - name: aws-iam-token
                              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                              readOnly: true
                              projected:
                                defaultMode: 420
                                sources:
                                  - serviceAccountToken:
                                      audience: sts.amazonaws.com
                                      expirationSeconds: 86400
                                      path: token
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-ecs-update-container-timeout-y7j.yaml
          - -saveName=/tmp/engine-name

  entrypoint: ecs-update-container-timeout
  arguments:
    parameters:
      - name: adminModeNamespace
        value: hce
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
status:
  startedAt: null
  finishedAt: null
