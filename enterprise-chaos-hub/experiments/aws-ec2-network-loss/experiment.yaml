---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: ec2-network-loss-1661585794
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: ec2-network-loss-qu8
            template: ec2-network-loss-qu8
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
    - name: ec2-network-loss-qu8
      inputs:
        artifacts:
          - name: ec2-network-loss-qu8
            path: /tmp/chaosengine-ec2-network-loss-qu8.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: ec2-network-loss-qu8
                  labels:
                    name: ec2-network-loss
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/enableAWSAccessViaSecrets: disable
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: ec2-network-loss
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name ec2-network-loss
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: REGION
                              value: ""
                            - name: EC2_INSTANCE_ID
                              value: ""
                            - name: NETWORK_PACKET_LOSS_PERCENTAGE
                              value: "100"
                            - name: DESTINATION_HOSTS
                              value: ''
                            - name: DESTINATION_IPS
                              value: ''
                            - name: SEQUENCE
                              value: 'parallel'
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                            - name: AWS_SHARED_CREDENTIALS_FILE
                              value: /tmp/cloud_config.yml
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
                          projectedVolumes:
                            - name: aws-iam-token
                              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
                              readOnly: true
                              projected:
                                defaultMode: 420
                                sources:
                                  - serviceAccountToken:
                                      audience: sts.amazonaws.com
                                      expirationSeconds: 86400
                                      path: token
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-ec2-network-loss-qu8.yaml
          - -saveName=/tmp/engine-name
    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (a12e3070-c8fe-48f6-b805-4ced081877e4, )' -n
            {{workflow.parameters.adminModeNamespace}} "
  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
status:
  startedAt:
  finishedAt:
