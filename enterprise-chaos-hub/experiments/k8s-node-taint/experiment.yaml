---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: node-taint-1658936670
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: node-taint-us4
            template: node-taint-us4
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: node-taint-us4
      inputs:
        artifacts:
          - name: node-taint-us4
            path: /tmp/chaosengine-node-taint-us4.yaml
            raw:
              data: >
                apiVersion: litmuschaos.io/v1alpha1

                kind: ChaosEngine

                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: node-taint-us4
                  labels:
                    name: node-taint
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  auxiliaryAppInfo: ""
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: node-taint
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name node-taint
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TARGET_NODE
                              value: ""
                            - name: NODE_LABEL
                              value: ""
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: RAMP_TIME
                              value: ""
                            - name: TAINTS
                              value: app.hce.io/chaos=true:NoSchedule
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-node-taint-us4.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/com/db/chaos-hce/thirdparty/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (500508d9-4623-4e33-b4b1-095f12173a57, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
