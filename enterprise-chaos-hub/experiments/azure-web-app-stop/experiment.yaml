---
kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: azure-webapp-stop-1659021032
  namespace: litmus

spec:
  templates:
    - name: custom-chaos
      steps:
        - - name: azure-web-app-stop-pd8
            template: azure-web-app-stop-pd8
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources

    - name: azure-web-app-stop-pd8
      inputs:
        artifacts:
          - name: azure-web-app-stop-pd8
            path: /tmp/chaosengine-azure-web-app-stop-pd8.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  generateName: azure-web-app-stop-pd8
                  labels:
                    name: azure-web-app-stop
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: experiment-job
                    app.kubernetes.io/version: ci
                spec:
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: azure-web-app-stop
                      image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
                      imagePullPolicy: Always
                      args:
                        - -c
                        - ./experiments -name azure-web-app-stop
                      command:
                        - /bin/bash
                      spec:
                        components:
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "60"
                            - name: CHAOS_INTERVAL
                              value: "30"
                            - name: RAMP_TIME
                              value: ""
                            - name: AZURE_WEB_APP_NAMES
                              value: ""
                            - name: RESOURCE_GROUP
                              value: ""
                            - name: AZURE_AUTH_LOCATION
                              value: /tmp/azure.auth
                            - name: SEQUENCE
                              value: parallel
                            - name: DEFAULT_HEALTH_CHECK
                              value: 'false'
                          secrets:
                            - name: cloud-secret
                              mountPath: /tmp/
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - ./chaos-checker
        args:
          - -file=/tmp/chaosengine-azure-web-app-stop-pd8.yaml
          - -saveName=/tmp/engine-name

    - name: cleanup-chaos-resources
      container:
        name: ""
        image: artifactory.sdlc.ctl.gcp.db.com/dkr-public-local/dkr-io/harness/chaos-go-runner:1.41.0
        command:
          - sh
          - -c
        args:
          - "kubectl delete chaosengine -l 'instance_id in
            (835bf025-8f86-4c3d-a915-5888f320482b, )' -n
            {{workflow.parameters.adminModeNamespace}} "

  entrypoint: custom-chaos
  arguments:
    parameters:
      - name: adminModeNamespace
        value: litmus
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
