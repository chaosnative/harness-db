kind: Workflow
apiVersion: argoproj.io/v1alpha1
metadata:
  name: sadsqwq
  namespace: upgrade-test-2
  labels:
    infra_id: 8600bb42-a3fc-41aa-827e-46a1f2e75d4c
    revision_id: 8b3964a3-0fa1-4c82-8a60-562d8975105b
    workflow_id: e96ace08-90a6-4241-96fe-2092953a58ca
    workflows.argoproj.io/controller-instanceid: 8600bb42-a3fc-41aa-827e-46a1f2e75d4c
spec:
  templates:
    - name: sadsqwq
      inputs: {}
      outputs: {}
      metadata: {}
      steps:
        - - name: install-chaos-faults
            template: install-chaos-faults
            arguments: {}
        - - name: pod-delete-dch
            template: pod-delete-dch
            arguments: {}
        - - name: cleanup-chaos-resources
            template: cleanup-chaos-resources
            arguments: {}
    - name: install-chaos-faults
      inputs:
        artifacts:
          - name: pod-delete-dch
            path: /tmp/pod-delete-dch.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                description:
                  message: |
                    Deletes a pod belonging to a deployment/statefulset/daemonset
                kind: ChaosExperiment
                metadata:
                  name: pod-delete
                  labels:
                    name: pod-delete
                    app.kubernetes.io/part-of: litmus
                    app.kubernetes.io/component: chaosexperiment
                    app.kubernetes.io/version: ci
                spec:
                  definition:
                    scope: Namespaced
                    permissions:
                      - apiGroups:
                          - ""
                        resources:
                          - pods
                        verbs:
                          - create
                          - delete
                          - get
                          - list
                          - patch
                          - update
                          - deletecollection
                      - apiGroups:
                          - ""
                        resources:
                          - events
                        verbs:
                          - create
                          - get
                          - list
                          - patch
                          - update
                      - apiGroups:
                          - ""
                        resources:
                          - configmaps
                        verbs:
                          - get
                          - list
                      - apiGroups:
                          - ""
                        resources:
                          - pods/log
                        verbs:
                          - get
                          - list
                          - watch
                      - apiGroups:
                          - ""
                        resources:
                          - pods/exec
                        verbs:
                          - get
                          - list
                          - create
                      - apiGroups:
                          - apps
                        resources:
                          - deployments
                          - statefulsets
                          - replicasets
                          - daemonsets
                        verbs:
                          - list
                          - get
                      - apiGroups:
                          - apps.openshift.io
                        resources:
                          - deploymentconfigs
                        verbs:
                          - list
                          - get
                      - apiGroups:
                          - ""
                        resources:
                          - replicationcontrollers
                        verbs:
                          - get
                          - list
                      - apiGroups:
                          - argoproj.io
                        resources:
                          - rollouts
                        verbs:
                          - list
                          - get
                      - apiGroups:
                          - batch
                        resources:
                          - jobs
                        verbs:
                          - create
                          - list
                          - get
                          - delete
                          - deletecollection
                      - apiGroups:
                          - litmuschaos.io
                        resources:
                          - chaosengines
                          - chaosexperiments
                          - chaosresults
                        verbs:
                          - create
                          - list
                          - get
                          - patch
                          - update
                          - delete
                    image: docker.io/harness/chaos-go-runner:1.36.0
                    imagePullPolicy: Always
                    args:
                      - -c
                      - ./experiments -name pod-delete
                    command:
                      - /bin/bash
                    env:
                      - name: TOTAL_CHAOS_DURATION
                        value: "15"
                      - name: RAMP_TIME
                        value: ""
                      - name: FORCE
                        value: "true"
                      - name: CHAOS_INTERVAL
                        value: "5"
                      - name: PODS_AFFECTED_PERC
                        value: ""
                      - name: TARGET_CONTAINER
                        value: ""
                      - name: TARGET_PODS
                        value: ""
                      - name: DEFAULT_HEALTH_CHECK
                        value: "false"
                      - name: NODE_LABEL
                        value: ""
                      - name: SEQUENCE
                        value: parallel
                    labels:
                      name: pod-delete
                      app.kubernetes.io/part-of: litmus
                      app.kubernetes.io/component: experiment-job
                      app.kubernetes.io/version: ci
                    securityContext:
                      podSecurityContext:
                        runAsUser: 2000
                        runAsGroup: 0
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: docker.io/harness/chaos-k8s:1.36.0
        command:
          - sh
          - "-c"
        args:
          - kubectl apply -f /tmp/ -n {{workflow.parameters.adminModeNamespace}} && sleep 30
        resources: {}
    - name: cleanup-chaos-resources
      inputs: {}
      outputs: {}
      metadata: {}
      container:
        name: ""
        image: docker.io/harness/chaos-k8s:1.36.0
        command:
          - sh
          - "-c"
        args:
          - kubectl delete chaosengine -l workflow_run_id={{workflow.uid}} -n {{workflow.parameters.adminModeNamespace}}
        resources: {}
    - name: pod-delete-dch
      inputs:
        artifacts:
          - name: pod-delete-dch
            path: /tmp/chaosengine-pod-delete-dch.yaml
            raw:
              data: |
                apiVersion: litmuschaos.io/v1alpha1
                kind: ChaosEngine
                metadata:
                  namespace: "{{workflow.parameters.adminModeNamespace}}"
                  labels:
                    workflow_run_id: "{{ workflow.uid }}"
                    workflow_name: sadsqwq
                  annotations:
                    probeRef: '[{"name":"1-36-x-k8s-http-get","mode":"SOT"}]'
                  generateName: pod-delete-dch
                spec:
                  appinfo:
                    appns: upgrade-test-2
                    applabel: app=chaos-exporter
                    appkind: deployment
                  engineState: active
                  chaosServiceAccount: litmus-admin
                  experiments:
                    - name: pod-delete
                      spec:
                        components:
                        # Mounting the configmaps containing scripts
                          configMaps:
                            - name: composer-pre-post-scripts
                              mountPath: /composer-pre-post-scripts
                          env:
                            - name: TOTAL_CHAOS_DURATION
                              value: "10"
                            - name: RAMP_TIME
                              value: ""
                            - name: FORCE
                              value: "true"
                            - name: CHAOS_INTERVAL
                              value: "5"
                            - name: PODS_AFFECTED_PERC
                              value: ""
                            - name: TARGET_CONTAINER
                              value: ""
                            - name: TARGET_PODS
                              value: ""
                            - name: DEFAULT_HEALTH_CHECK
                              value: "false"
                            - name: NODE_LABEL
                              value: ""
                            - name: SEQUENCE
                              value: parallel
                        probe:
                          - name: healthcheck
                            type: cmdProbe
                            mode: Edge
                            runProperties:
                              probeTimeout: 180s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: ./healthcheck -name pod-level
                              source:
                                image: docker.io/harness/chaos-go-runner:1.36.0
                                inheritInputs: true
                              comparator:
                                type: string
                                criteria: contains
                                value: "[P000]"
                          # Running pre-script to patch PDBs to 0
                          - name: pdb-update
                            type: cmdProbe
                            mode: SOT
                            runProperties:
                              probeTimeout: 180s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: bash /composer-pre-post-scripts/pre-script.sh
                              comparator:
                                type: string
                                criteria: contains
                                value: Done
                          # Running post-script to revert PDBs to actual values
                          - name: pdb-revert
                            type: cmdProbe
                            mode: EOT
                            runProperties:
                              probeTimeout: 180s
                              retry: 0
                              interval: 1s
                              stopOnFailure: false
                            cmdProbe/inputs:
                              command: bash /composer-pre-post-scripts/post-script.sh
                              comparator:
                                type: string
                                criteria: contains
                                value: Done
                  jobCleanUpPolicy: delete
      outputs: {}
      metadata:
        labels:
          weight: "10"
      container:
        name: ""
        image: docker.io/harness/litmus-checker:1.36.0
        command:
          - ./var/run/checker
        args:
          - "-file=/tmp/chaosengine-pod-delete-dch.yaml"
          - "-saveName=/tmp/engine-name"
        resources: {}
  entrypoint: sadsqwq
  arguments:
    parameters:
      - name: adminModeNamespace
        value: upgrade-test-2
  serviceAccountName: argo-chaos
  podGC:
    strategy: OnWorkflowCompletion
  securityContext:
    runAsUser: 1000
    runAsGroup: 0
    runAsNonRoot: true
status: {}
